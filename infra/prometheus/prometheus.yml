global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:3001"]

  - job_name: video-service
    metrics_path: /metrics
    static_configs:
      - targets: ["video-service:3000"]

  - job_name: processing-service
    metrics_path: /metrics
    static_configs:
      - targets: ["processing-service:9100"]

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:9101"]

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
