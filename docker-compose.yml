name: fiapx-video

x-jwt: &jwt-secret "super-secret-change-me"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    volumes:
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692" # métricas Prometheus (plugin rabbitmq_prometheus)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fiapx
      MINIO_ROOT_PASSWORD: fiapx12345
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  auth-service:
    build: ./auth-service
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://auth_user:auth_pass@postgres:5432/auth_db
      JWT_SECRET: *jwt-secret
      JWT_EXPIRES_IN: 3600s
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  video-service:
    build: ./video-service
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://video_user:video_pass@postgres:5432/video_db
      JWT_SECRET: *jwt-secret
      JWT_EXPIRES_IN: 3600s
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: video-events
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: fiapx
      MINIO_SECRET_KEY: fiapx12345
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_RAW: videos-raw
      MINIO_BUCKET_ZIPS: videos-zips
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure

  processing-service:
    build: ./processing-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: video-events
      RABBITMQ_MAX_RETRIES: 3
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: fiapx
      MINIO_SECRET_KEY: fiapx12345
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_RAW: videos-raw
      MINIO_BUCKET_ZIPS: videos-zips
      FRAME_RATE: 1
      METRICS_PORT: 9100
    ports:
      - "9100:9100" # métricas Prometheus
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure

  notification-service:
    build: ./notification-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: video-events
      RABBITMQ_MAX_RETRIES: 3
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@fiapx.com
      METRICS_PORT: 9101
    ports:
      - "9101:9101" # métricas Prometheus
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - video-service
      - processing-service
      - notification-service
      - rabbitmq

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
  prometheusdata:
  grafanadata:
